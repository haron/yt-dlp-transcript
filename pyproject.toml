[project]
name = "yt-dlp-transcript"
version = "0.1.22"
description = "Handy yt-dlp wrapper to download Youtube videos transcripts"
authors = [
  { name="Alexander Ryabov", email="alex.ryabov@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp==2026.8.19",
    "ConfigArgParse>=1.7",
    "srt>=3.5.3",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[dependency-groups]
dev = [
  "isort",
  "ruff",
  "safety",
  "ty",
]

[project.scripts]
yt-dlp-transcript = "yt_dlp_transcript:main"

[tool.uv]
package = true

[project.urls]
Homepage = "https://github.com/haron/yt-dlp-transcript"
Issues = "https://github.com/haron/yt-dlp-transcript/issues"

[tool.ruff]
line-length = 140

